version: v2
plugins:
  - local: ../tools/bin/protoc-gen-go
    out: ../kernel/gen
    opt: paths=source_relative
  - local: ../tools/bin/protoc-gen-connect-go
    out: ../kernel/gen
    opt: paths=source_relative
  - local: ../node_modules/.bin/protoc-gen-es
    out: ../packages/sdk/src/gen
    opt: target=ts
