syntax = "proto3";

package kernel.v1;

option go_package = "github.com/nexusthrive/nexusthrive/kernel/gen/kernel/v1;kernelv1";

// ErrorCode identifies a public domain failure without database details.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PERMISSION_DENIED = 1;
  ERROR_CODE_CAPABILITY_INACTIVE = 2;
  ERROR_CODE_RULE_VIOLATION = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_ALREADY_DONE = 5;
  ERROR_CODE_INVALID_INPUT = 6;
  ERROR_CODE_SPACE_SUSPENDED = 7;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 8;
  // The transaction aborted; repeat using the same key and body.
  ERROR_CODE_RETRYABLE = 9;
}

// OperationError is a typed Connect error detail, never an internal cause.
message OperationError {
  ErrorCode code = 1;
  string message = 2;
}
