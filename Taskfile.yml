version: "3"

vars:
  # Every Go module listed in go.work. The root has no module, so patterns
  # such as ./kernel/... cannot cover them all; absolute directories can.
  GO_PACKAGES:
    sh: go list -m -f '{{"{{.Dir}}"}}/...' | tr '\n' ' '
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@2025.1.1
  BUF: github.com/bufbuild/buf/cmd/buf@v1.50.0

tasks:
  setup:
    desc: Install dependencies (requires Go, Node.js and pnpm from .tool-versions)
    preconditions:
      - sh: command -v pnpm
        msg: pnpm is required; see docs/07-ingenieria/development-setup.md
    cmds:
      - go work sync
      - pnpm install --frozen-lockfile

  infra:up:
    desc: Start local PostgreSQL and Redis
    cmds:
      - docker compose -f infra/docker/compose.yaml up -d --wait

  infra:down:
    desc: Stop local infrastructure
    cmds:
      - docker compose -f infra/docker/compose.yaml down

  db:migrate:
    desc: Create the kernel schema and apply its migrations (DATABASE_URL, local PostgreSQL by default)
    vars:
      # Same credentials as infra/docker/compose.yaml.
      DB_URL:
        sh: echo "${DATABASE_URL:-postgres://nexusthrive:nexusthrive@localhost:55432/nexusthrive?sslmode=disable}"
    env:
      DATABASE_URL: "{{.DB_URL}}"
    cmds:
      - go run github.com/nexusthrive/nexusthrive/kernel/db/cmd/migrate

  gen:
    desc: Generate code from contracts (Go, TypeScript, Python)
    dir: contracts
    cmds:
      # buf rejects a module without .proto files; no operation exists yet in B1.
      - cmd: if [ -n "$(find proto -name '*.proto')" ]; then go run {{.BUF}} generate; fi
        silent: true

  dev:
    desc: Run the API and the web apps
    deps: [infra:up]
    cmds:
      - go run ./services/api/cmd/api & pnpm dev

  test:
    desc: Run every test suite
    cmds:
      - task: test:go
      - task: test:ts

  test:go:
    desc: Run the Go tests of every module
    cmds:
      - go test {{.GO_PACKAGES}}

  test:ts:
    desc: Run the TypeScript tests of every workspace
    cmds:
      - pnpm test

  lint:
    desc: Lint Go, TypeScript and contracts
    cmds:
      - task: lint:go
      - task: lint:ts
      - task: lint:contracts

  lint:go:
    desc: Check formatting, vet and staticcheck on every Go module
    cmds:
      - test -z "$(gofmt -l kernel platform distributions services)" || (gofmt -l kernel platform distributions services && exit 1)
      - go vet {{.GO_PACKAGES}}
      - go run {{.STATICCHECK}} {{.GO_PACKAGES}}

  lint:ts:
    desc: Lint every TypeScript workspace
    cmds:
      - pnpm lint

  lint:contracts:
    desc: Lint the Protobuf contracts
    cmds:
      # buf rejects a module without .proto files; no operation exists yet in B1.
      - cmd: if [ -n "$(find contracts/proto -name '*.proto')" ]; then go run {{.BUF}} lint contracts; fi
        silent: true

  tokens:check:
    desc: Verify tokens.json mirrors tokens.css and the radius scale is consistent
    cmds:
      - node tools/tokens-check.mjs

  docs:check:
    desc: Render every Mermaid diagram in docs to catch syntax errors
    cmds:
      - node tools/docs-check.mjs
