name: nexusthrive

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nexusthrive
      POSTGRES_PASSWORD: nexusthrive
      POSTGRES_DB: nexusthrive
    ports:
      - "${NEXUSTHRIVE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Lets `docker compose up --wait` return only when PostgreSQL accepts
    # connections, so `task db:migrate` can follow `task infra:up` directly.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusthrive -d nexusthrive"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
