name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Integration branches and Dependabot branches are exempt.
          if [[ "$HEAD_REF" =~ ^sprint/S[0-9]{2}$ ]] || [[ "$HEAD_REF" == dependabot/* ]]; then
            exit 0
          fi
          if [[ ! "$HEAD_REF" =~ ^(feature|fix|chore|hotfix)/HU-[a-z0-9]+(-[a-z0-9]+)*-[0-9]{2}$ ]]; then
            echo "::error::Branch '$HEAD_REF' must match ^(feature|fix|chore|hotfix)/HU-[a-z0-9]+(-[a-z0-9]+)*-[0-9]{2}$ (or sprint/S<nn>)."
            exit 1
          fi

  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'kernel/**'
              - 'platform/**'
              - 'distributions/**'
              - 'services/api/**'
              - 'go.work'
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
            docs:
              - 'docs/**'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./kernel/... ./platform/... ./distributions/... ./services/api/...
      - run: go test ./kernel/... ./platform/... ./distributions/... ./services/api/...

  typescript:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/docs-check.mjs
